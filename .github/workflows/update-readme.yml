name: Update README counter

on:
  push:
    branches: [main]
    paths:
      - "Easy/**"
      - "Medium/**"
      - "Hard/**"
      - ".github/scripts/update-readme.mjs"
      - ".github/workflows/update-readme.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate README sections
        run: node .github/scripts/update-readme.mjs

      - name: Commit changes if any
        run: |
          if git diff --quiet -- README.md; then
            echo "README already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update solution counter [skip ci]"
          git push
